<div class="container2 border-round">
    <h1 class="header">Список дел</h1>
    <div class="container border-round">
        <div class="container fl">
            <ul>                
                @if(isLoading) {
                    <div class="spinner"></div>
                } @else {
                    @for (listItem of items;track listItem.id) {
                        <li [class.selected]="listItem.id == selectedItemId">
                            <div class="fl2">
                                <app-to-do-list-item
                                    [itemsList]="listItem" (dltItem)="delItem($event)" 
                                    (click)="selectItem(listItem.id)"
                                    [appTooltipsItem]="listItem.description"
                                    >              
                                </app-to-do-list-item>  
                            </div>
                        </li>     
                    }  
                }   
            </ul>
            <div class="fl3">
                @for (listItem of items;track listItem.id){
                @if(listItem.id == selectedItemId) {                
                    {{listItem.description}}             
                } }
            </div>  
        </div>   
    </div>                   
        <div class="container fl">
            <div class="fl2">
                <input matInput type="text" placeholder="Добавить новое задание" [(ngModel)]="newItem" (ngModelChange)="editInput(newItem)">  
                <textarea [(ngModel)]="newDescription" ></textarea>
            </div>
            <app-button [style.opacity]="!ActiveAdd ? 0.5 : 1" class="button-add" (click)="addItem(newItem, newDescription)" [titleButton]="'Добавить'"
                [appTooltipsItem]="'Добавить запись'">
            </app-button>
        </div>
    <p>

</div>
